# Serves the built SPA and proxies API calls to the FastAPI container, so the
# browser only ever talks to one origin (no CORS, no VITE_API_BASE to set).

upstream api_upstream {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets are immutable; cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Streaming chat: buffering MUST be off or SSE frames arrive in bulk ---
    location /chat {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # --- Plain JSON endpoints and File Uploads ---
    location ~ ^/(summarize|health|learn|docs|redoc|openapi\.json|upload|sources(/.*)?)$ {
        # Allow large file uploads (matching the 50MB backend limit)
        client_max_body_size 55M;
        
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # SPA fallback — every other path renders the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
